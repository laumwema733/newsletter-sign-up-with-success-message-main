<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->
    <link rel="stylesheet" href="styles.css" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/images/favicon-32x32.png"
    />

    <title>
      Frontend Mentor | Newsletter sign-up form with success message
    </title>

    <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
    <style>
      .attribution {
        font-size: 11px;
        text-align: center;
      }
      .attribution a {
        color: hsl(228, 45%, 44%);
      }
    </style>
  </head>
  <body>
    <!-- Sign-up form start -->
    <article class="form-data">
      <picture class="top">
        <source
          media="(min-width: 1000px)"
          srcset="./assets/images/illustration-sign-up-desktop.svg"
        />
        <source
          media="(max-width: 599px)"
          srcset="./assets/images/illustration-sign-up-mobile.svg"
        />
        <source
          media="(min-width: 600px)"
          srcset="./assets/images/illustration-sign-up-tablet.svg"
        />
        <img
          src="./assets/images/illustration-sign-up-mobile.svg"
          alt="illustration picture"
        />
      </picture>
      <div class="mid-section">
        <div class="text">
          <h1 class="title">Stay update!</h1>
          <p>
            Stay updated! Join 60,000+ product managers receiving monthly
            updates on:
          </p>

          <ul>
            <li>Product discovery and building what matters</li>
            <li>Measuring to ensure updates are a success</li>
            <li>And much more!</li>
          </ul>
        </div>
        <form>
          <label for="email">Email address</label>
          <input
            type="email"
            name="email"
            id="email"
            required
            placeholder="email@company.com"
          />
          <button class="btn">Subscribe to monthly newsletter</button>
        </form>
      </div>
    </article>

    <!-- Product discovery and building what matters Measuring to ensure updates are
    a success And much more! Email address email@company.com  -->

    <!-- Sign-up form end -->

    <!-- Success message start -->

    <!-- Thanks for subscribing! A confirmation email has been sent to
    ash@loremcompany.com. Please open it and click the button inside to confirm
    your subscription. Dismiss message -->

    <!-- Success message end -->

        >Frontend Mentor</a

    </div> -->
  </body>
</html>
